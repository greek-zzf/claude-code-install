name: Build and Release App

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的 tag（如 v1.0.0）时触发

jobs:
  release:
    name: Build & Release Electron App
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        # 同时启动 Windows 虚拟机和 macOS 虚拟机进行打包
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install Dependencies
        run: |
          cd gui
          npm ci

      - name: Build & Package App
        # 先运行编译，再在 Windows 上打包 exe，在 Mac 上打包 dmg
        run: |
          cd gui
          npm run build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx electron-builder --mac --x64 --arm64
          else
            npx electron-builder --win --x64
          fi
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            gui/release/*.dmg
            gui/release/*.exe
            gui/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts for Sync
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            gui/release/*.dmg
            gui/release/*.exe

  sync-to-gitee:
    name: Sync Release to Gitee
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Gitee via API
        run: |
          echo "Creating Gitee Release for tag ${{ github.ref_name }}..."
          
          # 伪装为 Chrome 浏览器，防止 WAF 针对 curl 默认特征在 TLS 握手时直接挂起
          RELEASE_JSON=$(curl -4 -v -X POST -m 45 --connect-timeout 20 --retry 2 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            -H "Accept: application/json" \
            -H "Connection: keep-alive" \
            "https://gitee.com/api/v5/repos/geek-zzf/claude-code-install/releases?access_token=${{ secrets.GITEE_TOKEN }}&tag_name=${{ github.ref_name }}&name=Release%20${{ github.ref_name }}") || {
              echo "Warning: Gitee API is blocked by WAF (TLS timeout). Skipping Gitee sync."
              exit 0
            }
          
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create release (possibly already exists). Fetching existing release ID..."
            RELEASES_LIST=$(curl -4 -v -m 30 --connect-timeout 15 --retry 2 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: application/json" \
              "https://gitee.com/api/v5/repos/geek-zzf/claude-code-install/releases?access_token=${{ secrets.GITEE_TOKEN }}&page=1&per_page=20") || {
                echo "Warning: Gitee API fetching failed. Skipping Gitee sync."
                exit 0
              }
            RELEASE_ID=$(echo "$RELEASES_LIST" | node -e '
              let data = "";
              process.stdin.on("data", chunk => data += chunk);
              process.stdin.on("end", () => {
                try {
                  const list = JSON.parse(data);
                  const rel = list.find(r => r.tag_name === process.argv[1]);
                  if (rel) process.stdout.write(rel.id.toString());
                } catch(e) {}
              });
            ' "${{ github.ref_name }}")
          fi
          
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "undefined" ]; then
            echo "Warning: Could not retrieve Gitee Release ID (WAF block or API error). Skipping Gitee sync."
            echo "API Response: $RELEASE_JSON"
            exit 0
          fi
          
          echo "Using Gitee Release ID: $RELEASE_ID"
          
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) | while read filepath; do
            filename=$(basename "$filepath")
            echo "Uploading $filename to Gitee..."
            UPLOAD_RESP=$(curl -4 -v -X POST -m 180 --connect-timeout 30 --retry 3 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Connection: keep-alive" \
              -F "access_token=${{ secrets.GITEE_TOKEN }}" \
              -F "file=@$filepath" \
              "https://gitee.com/api/v5/repos/geek-zzf/claude-code-install/releases/$RELEASE_ID/attach_files") || {
                echo "Warning: Failed to upload artifact $filename to Gitee. Skipping."
                continue
              }
            echo "Response: $UPLOAD_RESP"
          done
        shell: bash
