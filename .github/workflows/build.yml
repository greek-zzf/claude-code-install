name: Build and Release App

on:
  push:
    tags:
      - 'v*' # 当你推送以 v 开头的 tag（如 v1.0.0）时触发

jobs:
  release:
    name: Build & Release Electron App
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      matrix:
        # 同时启动 Windows 虚拟机和 macOS 虚拟机进行打包
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: gui/package-lock.json

      - name: Install Dependencies
        run: |
          cd gui
          npm ci

      - name: Build & Package App
        # 先运行编译，再在 Windows 上打包 exe，在 Mac 上打包 dmg
        run: |
          cd gui
          npm run build
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            npx electron-builder --mac --x64 --arm64
          else
            npx electron-builder --win --x64
          fi
        shell: bash

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            gui/release/*.dmg
            gui/release/*.exe
            gui/release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts for Sync
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            gui/release/*.dmg
            gui/release/*.exe

  upload-to-r2:
    name: Upload Release to Cloudflare R2
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to Cloudflare R2
        run: |
          # 配置 AWS CLI
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }} --profile r2
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }} --profile r2
          
          # 上传附件到 R2
          find artifacts -type f \( -name "*.dmg" -o -name "*.exe" \) | while read filepath; do
            filename=$(basename "$filepath")
            echo "Uploading $filename to Cloudflare R2..."
            aws s3 cp "$filepath" "s3://${{ env.R2_BUCKET }}/${{ github.ref_name }}/$filename" \
              --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" \
              --profile r2
          done
        env:
          R2_BUCKET: claude-code-installer # 如果你的 R2 存储桶不是这个名字，请修改这里

      - name: Update index.html Download Links
        run: |
          export TAG_NAME="${{ github.ref_name }}"
          export APP_VERSION=$(node -p "require('./gui/package.json').version")
          echo "Updating index.html with Tag: $TAG_NAME, App Version: $APP_VERSION"
          node -e "
            const fs = require('fs');
            let content = fs.readFileSync('index.html', 'utf8');
            content = content.replace(/https:\/\/download\.felix\.garden\/v[^\/]+\//g, 'https://download.felix.garden/' + process.env.TAG_NAME + '/');
            content = content.replace(/Claude\.Code\.-[0-9.]+-arm64\.dmg/g, 'Claude.Code.-' + process.env.APP_VERSION + '-arm64.dmg');
            content = content.replace(/Claude\.Code\.Setup\.[0-9.]+\.exe/g, 'Claude.Code.Setup.' + process.env.APP_VERSION + '.exe');
            content = content.replace(/Claude\.Code\.-[0-9.]+\.dmg/g, 'Claude.Code.-' + process.env.APP_VERSION + '.dmg');
            fs.writeFileSync('index.html', content);
          "

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit"
          else
            git commit -m "chore: update download links for ${{ github.ref_name }}"
            git push origin main
          fi
